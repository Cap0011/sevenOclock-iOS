name: iOS CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: |
          xcodebuild \
            -project sevenOclock/sevenOclock.xcodeproj \
            -scheme sevenOclock \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build
